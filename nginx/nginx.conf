# AegisX WAF - OpenResty Configuration
# High-performance reverse proxy with Lua-based WAF interception

worker_processes auto;
error_log stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # DNS Resolver for Docker internal DNS
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /dev/stdout main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # GeoIP2 Configuration
    # Uncomment when GeoIP database is available
    # geoip2 /usr/local/geoip/GeoLite2-City.mmdb {
    #     auto_reload 5m;
    #     $geoip2_data_country_code country iso_code;
    #     $geoip2_data_city_name city names en;
    #     $geoip2_data_latitude location latitude;
    #     $geoip2_data_longitude location longitude;
    # }

    # Lua module path
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";
    lua_code_cache on;

    # Shared dictionary for rate limiting
    lua_shared_dict waf_cache 10m;
    lua_shared_dict rate_limit 10m;

    # Main server block
    server {
        listen 80;
        server_name _;

        # === PRODUCTION REAL-IP EXTRACTION ===
        # Trust IPs from Cloudflare (IPv4 & IPv6) and general private subnets for internal Docker LB
        
        # Cloudflare IPv4
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        
        # Cloudflare IPv6
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;

        # Local Docker Network (for local load balancers)
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 192.168.0.0/16;
        
        # Extract Real IP from X-Forwarded-For (handles all CDNs including Cloudflare)
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Health check endpoint (bypass WAF)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # WebSocket proxy for dashboard
        location /ws {
            set $waf_backend "http://waf-engine:5000";
            proxy_pass $waf_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API endpoints (bypass WAF interception)
        location /api/ {
            set $waf_backend "http://waf-engine:5000";
            proxy_pass $waf_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # All other requests - WAF interception
        location / {
            # WAF interception in Lua
            access_by_lua_file /usr/local/openresty/nginx/lua/waf_interceptor.lua;

            # Get target upstream URL from environment (defaulting to a placeholder)
            set_by_lua_block $upstream_target {
                return os.getenv("UPSTREAM_APP_URL") or "http://waf-engine:5000/health"
            }

            # Proxy to the actual backend application
            proxy_pass $upstream_target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Additional headers for security and tracing
            proxy_set_header X-WAF-Protected "AegisX";
        }
    }
}
