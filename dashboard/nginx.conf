upstream backend {
    # Change this to the address of your real application (e.g., host.docker.internal:8080)
    server host.docker.internal:8080;
}

server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve static assets (if any) – typical for a SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the WAF engine
    location /api/ {
        proxy_pass http://waf-engine:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebSocket connections to the WAF engine (dashboard UI)
    location /ws/ {
        proxy_pass http://waf-engine:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Forward all other traffic to the protected backend, adding a header that tells the WAF to inspect the request
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-WAF-ENABLED true;
    }
}
